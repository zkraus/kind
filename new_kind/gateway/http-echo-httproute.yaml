apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: r-echo
  namespace: default           # [H] must match Gateway namespace (allowedRoutes: Same)
spec:
  parentRefs:
    - name: g-echo             # [G] must match Gateway metadata.name
      sectionName: http        # [I] must match Gateway listeners[].name
  # no "hostnames:" - the route matches any Host header, so a plain
  # curl against the LoadBalancer IP works without a -H "Host: ..." flag
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: s-echo         # [J] must match the existing Service metadata.name
          port: 80             # [K] must match that Service spec.ports[].port (NOT targetPort)
# Backend lives in ../echo/d-echo.yaml and is reused as-is.
# Its type stays NodePort; the Gateway reaches it over the ClusterIP, so the
# NodePort 30000 -> host 2000 path keeps working independently of this route.
