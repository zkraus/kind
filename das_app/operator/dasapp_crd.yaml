---
# CustomResourceDefinition (CRD) defines a new resource type "DasApp"
# This tells Kubernetes: "DasApp is now a valid resource, like Pod or Service"
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dasapps.dasapp.example.com
spec:
  # Which API group this CRD belongs to
  group: dasapp.example.com
  names:
    # Plural name (used in URLs: /apis/dasapp.example.com/v1/dasapps)
    plural: dasapps
    # Singular name (for display)
    singular: dasapp
    # Kind name (what you write in YAML: kind: DasApp)
    kind: DasApp
    # Short name for kubectl (kubectl get da)
    shortNames:
      - da
  # Scope: Namespaced means each DasApp lives in a namespace
  # (alternative: Cluster - for cluster-wide resources)
  scope: Namespaced
  versions:
    - name: v1
      # This version is the current one we serve
      served: true
      # This version is used for storage in etcd
      storage: true
      # Schema validation - defines what fields are allowed in DasApp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # How many replicas of das_app to run
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                # Custom label shown in the app (goes to APP_LABEL env var)
                label:
                  type: string
                  default: "Das APP"
                # Container image to use
                image:
                  type: string
                  default: "das_app:latest"
                # Port the app listens on
                port:
                  type: integer
                  default: 8080
                # Service type: ClusterIP or LoadBalancer
                serviceType:
                  type: string
                  enum: ["ClusterIP", "LoadBalancer"]
                  default: "ClusterIP"
              required:
                - replicas
                - image
            # Status subresource - operator writes here, users read
            status:
              type: object
              properties:
                # Is the app ready?
                ready:
                  type: boolean
                # How many pods are healthy?
                healthyReplicas:
                  type: integer
                # Last time we checked health
                lastHealthCheck:
                  type: string
      # additionalPrinterColumns shows extra info in "kubectl get dasapps"
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Healthy
          type: integer
          jsonPath: .status.healthyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      # Status subresource enables /status endpoint for status updates
      subresources:
        status: {}
