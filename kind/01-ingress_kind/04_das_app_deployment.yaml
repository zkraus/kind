apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-app
  template:
    metadata:
      labels:
        app: echo-app
    spec:
      containers:
        - name: http-echo
          image: das_app:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_LABEL
              value: "hello from KIND"
            - name: HTTP_PORT
              value: "8080"
            
