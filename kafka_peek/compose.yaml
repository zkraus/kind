services:
  kafka:
    image: ${KAFKA_IMAGE:-quay.io/strimzi/kafka:latest-kafka-3.8.0}
    command:
      - sh
      - -c
      - "bin/kafka-storage.sh format -t $(bin/kafka-storage.sh random-uuid) -c config/kraft/server.properties && bin/kafka-server-start.sh config/kraft/server.properties --override advertised.listeners=PLAINTEXT://kafka:9092 --override num.partitions=3"
    environment:
      LOG_DIR: /tmp/logs
    healthcheck:
      test: ["CMD-SHELL", "bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      KAFKA_BROKER: kafka:9092
       healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build: ./worker
    env_file:
      - .env
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:9092}
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:v0.7.2
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BROKER:-kafka:9092}
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy